<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Envie suas fotos / vídeos 📸</h1>
    <p>Pode selecionar várias fotos e vídeos de até 10s.</p>

    <label for="file" class="btn">Escolher arquivos</label>
    <input id="file" type="file" accept="image/*,video/*" multiple hidden />

    <div id="preview" class="preview-grid"></div>
    <button id="enviar" disabled>Salvar</button>
    <p id="status"></p>

    <p class="link"><a href="galeria.html">Ver galeria →</a></p>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
