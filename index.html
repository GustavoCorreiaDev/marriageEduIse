<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enviar Foto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Envie sua foto 📸</h1>
    <p>Tire ou escolha uma foto. Ela será otimizada automaticamente.</p>

    <label for="file" class="btn">Escolher / Tirar foto</label>
    <input id="file" type="file" accept="image/*" capture="environment" hidden />

    <div id="preview"></div>
    <button id="enviar" disabled>Salvar foto</button>
    <p id="status"></p>

    <p class="link">
      <a href="galeria.html">Ver fotos salvas →</a>
    </p>
  </main>

  <script src="app.js"></script>
</body>
</html>
