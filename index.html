<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Enviar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <header class="hero">
    <p class="hero-eyebrow">Galeria do Casamento</p>
    <h1 class="hero-nomes">Eduardo <span class="amp">&</span> Taise</h1>
    <div class="hero-ornamento">❦</div>
  </header>

  <p class="intro">
    Compartilhe os momentos que você capturou.<br/>
    Fotos e vídeos curtos (até 10s).
  </p>

  <label for="file" class="btn">Escolher arquivos</label>
  <input id="file" type="file" accept="image/*,video/*" multiple hidden />

  <div id="preview" class="preview-grid"></div>
  <button id="enviar" disabled>Salvar na galeria</button>
  <p id="status"></p>

  <p class="link"><a href="galeria.html">Ver galeria →</a></p>
</main>

  <script type="module" src="app.js"></script>

</html>
